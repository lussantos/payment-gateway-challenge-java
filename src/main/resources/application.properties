server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
payment.supported-currencies=USD,EUR,GBP
payment.encryption.secret=${PAYMENT_ENCRYPTION_SECRET:local-development-secret}
payment.encryption.salt=${PAYMENT_ENCRYPTION_SALT:5c0744940b5c369b}
bank-simulator.payments-url=http://localhost:8080/payments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_gateway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payment_gateway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:payment_gateway}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
