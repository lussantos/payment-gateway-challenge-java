server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
payment.supported-currencies=USD,EUR,GBP
payment.encryption.secret=test-payment-encryption-secret
payment.encryption.salt=5c0744940b5c369b
bank-simulator.payments-url=http://localhost:8080/payments
spring.datasource.url=jdbc:h2:mem:payment_gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
