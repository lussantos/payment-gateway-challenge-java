services:
  postgres:
    container_name: payment_gateway_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: payment_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_gateway}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  payment_gateway:
    profiles: ["gateway"]
    container_name: payment_gateway
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      bank_simulator:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      BANK_SIMULATOR_PAYMENTS_URL: http://bank_simulator:8080/payments
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_USERNAME: payment_gateway
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payment_gateway}
    ports:
      - "8090:8090"

volumes:
  postgres_data:
